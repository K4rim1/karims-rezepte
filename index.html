<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karim’s Rezepte</title>
<meta name="description" content="Rezepte sammeln, Woche planen, günstig einkaufen – mit Import aus TikTok, Instagram und Osta.">
<meta name="theme-color" content="#120E1D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Karim’s Rezepte">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #0E0B16; --surface: #1A1526; --surface-2: #231C33; --surface-3: #2E2543; --ink: #F3EFFC; --muted: #B4AACB; --faint: #7F7598; --line: #2E2642;
  --accent: #7C4DFF; --accent-text: #B8A1FF; --accent-soft: #2A2045; --danger: #FF8A80; --gold: #FFD66B;
  --grad: linear-gradient(135deg, #7C4DFF 0%, #B14DFF 100%);
  --ph: linear-gradient(135deg, #3A2470, #1C1430);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 18px; --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35);
  --tabh: 60px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); font: 16px/1.5 var(--sans); min-height: 100vh; background: radial-gradient(1200px 520px at 50% -220px, #2A1B4A 0%, var(--bg) 60%) no-repeat, var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
a { color: var(--accent-text); }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.ic { flex: none; display: block; }

/* Kopfzeilen */
.bar { position: sticky; top: 0; z-index: 10; padding-top: env(safe-area-inset-top); background: rgba(14,11,22,.82); -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 760px; margin: 0 auto; height: 52px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 6px; }
.bar-l { justify-self: start; display: flex; align-items: center; min-width: 0; }
.bar-r { justify-self: end; display: flex; align-items: center; gap: 2px; }
.bar-title { font-weight: 650; font-size: 16px; white-space: nowrap; }
.tbtn { display: inline-flex; align-items: center; gap: 2px; height: 40px; padding: 0 10px; border-radius: 10px; font-size: 16px; }
.tbtn.icon { width: 42px; justify-content: center; padding: 0; }
.tbtn:active { background: rgba(255,255,255,.08); }
.tbtn.strong { background: var(--grad); color: #fff; font-weight: 650; height: 34px; padding: 0 16px; border-radius: 999px; margin-right: 4px; }
.top { max-width: 760px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 16px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.h1 { font-size: 32px; line-height: 1.08; font-weight: 800; letter-spacing: -.03em; margin: 0; }
.h1 small { display: block; font-size: 13px; font-weight: 650; letter-spacing: 0; color: var(--accent-text); margin-bottom: 4px; }
.top-act { display: flex; gap: 8px; }
.round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); flex: none; }
.round:active { background: var(--surface-2); }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px calc(var(--tabh) + 100px + env(safe-area-inset-bottom)); }
.wrap.notab { padding-bottom: calc(48px + env(safe-area-inset-bottom)); }

/* Untere Leiste */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: rgba(16,12,26,.9); -webkit-backdrop-filter: saturate(160%) blur(20px); backdrop-filter: saturate(160%) blur(20px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabh); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 650; color: var(--faint); position: relative; }
.tab.on { color: var(--accent-text); }
.tab .badge { position: absolute; top: 5px; left: calc(50% + 7px); }
.badge { min-width: 18px; height: 18px; border-radius: 9px; background: var(--grad); color: #fff; font-size: 11px; font-weight: 750; display: grid; place-items: center; padding: 0 5px; line-height: 1; }
.fab { position: fixed; right: max(16px, calc(50% - 364px)); bottom: calc(var(--tabh) + 16px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--grad); color: #fff; box-shadow: 0 10px 30px rgba(124,77,255,.5); z-index: 14; }
.fab:active { transform: scale(.94); }

/* Suche, Ordner-Chips */
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 6px 0 12px; color: var(--faint); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; height: 44px; font: inherit; color: var(--ink); outline: none; -webkit-appearance: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search .x { width: 32px; height: 32px; display: grid; place-items: center; color: var(--faint); }
.fchips { display: flex; gap: 8px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.fchips::-webkit-scrollbar { display: none; }
.fchip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 650; color: var(--muted); white-space: nowrap; }
.fchip small { font-weight: 500; color: var(--faint); }
.fchip.on { background: var(--grad); border-color: transparent; color: #fff; }
.fchip.on small { color: rgba(255,255,255,.85); }
.fchip.add { border-style: dashed; color: var(--accent-text); }
.sel-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.list-head, .sec-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 2px 10px; }
.sec-row { margin: 0 2px 10px; }
.sec { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0; display: flex; align-items: center; gap: 7px; }
.sec-sum { font-weight: 650; font-size: 15px; }
.linkbtn { display: inline-flex; align-items: center; gap: 4px; color: var(--accent-text); font-weight: 650; font-size: 14px; white-space: nowrap; }

/* Karten für Einfügen und Entwurf */
.paste-cta { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border-radius: var(--r); padding: 14px 16px; margin-bottom: 14px; background: linear-gradient(135deg, rgba(124,77,255,.22), rgba(177,77,255,.10)); border: 1px solid rgba(184,161,255,.35); }
.paste-cta > .ic { color: var(--accent-text); }
.paste-cta strong { display: block; font-weight: 650; }
.paste-cta small { display: block; color: var(--muted); font-size: 13px; }
.paste-cta:active { background: var(--accent-soft); }
.hint, .draft { display: flex; gap: 10px; align-items: center; background: var(--accent-soft); border: 1px solid rgba(184,161,255,.25); border-radius: var(--r); padding: 12px 8px 12px 14px; margin-bottom: 14px; font-size: 14px; line-height: 1.45; }
.hint .x, .draft .x { margin-left: auto; color: var(--muted); width: 32px; height: 32px; display: grid; place-items: center; flex: none; }
.draft span { flex: 1; min-width: 0; } .draft b { display: block; } .draft small { color: var(--muted); }
.draft .go { color: var(--accent-text); font-weight: 700; padding: 0 8px; height: 32px; }

/* Rezeptkarten */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; }
.card { position: relative; display: flex; flex-direction: column; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); transition: transform .12s; }
.card:active { transform: scale(.975); }
.ph { position: relative; display: grid; place-items: center; overflow: hidden; background: var(--ph); }
.ph img, .hero img, .pe-ph img, .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.emo { line-height: 1; filter: drop-shadow(0 6px 14px rgba(0,0,0,.35)); }
.card .ph { aspect-ratio: 4 / 3; }
.card .emo { font-size: 46px; }
.card-b { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card-t { font-size: 15.5px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-m { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); margin-top: auto; }
.card-m span { display: inline-flex; align-items: center; gap: 4px; }
.pins { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; gap: 4px; pointer-events: none; }
.pin { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 999px; background: rgba(14,11,22,.74); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: 12px; font-weight: 750; color: #fff; }
.pin.star { color: var(--gold); padding: 0 6px; }
.pin-r { display: flex; gap: 4px; margin-left: auto; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.empty .ic { margin: 0 auto 10px; color: var(--faint); }
.empty-t { font-size: 20px; font-weight: 750; color: var(--ink); margin: 0 0 4px; }
.empty p { margin: 0 auto; max-width: 320px; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; animation: fade .15s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 10px 16px calc(22px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain; animation: up .22s ease-out; }
.scrim.still, .sheet.still { animation: none; }
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet-t { font-size: 21px; font-weight: 800; letter-spacing: -.02em; margin: 0 4px 12px; }
.sheet-sub { color: var(--muted); font-size: 14px; margin: -6px 4px 12px; }
.opt { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 13px 12px; border-radius: 14px; border: 1px solid var(--line); margin-bottom: 10px; background: var(--surface-2); }
.opt-ic { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--accent-text); flex: none; }
.opt-ic.accent { background: var(--grad); color: #fff; }
.opt strong { display: block; font-weight: 650; }
.opt small { display: block; color: var(--muted); font-size: 13px; }
.opt.danger, .opt.danger .opt-ic { color: var(--danger); }
.opt .grow { flex: 1; min-width: 0; }
.opt .chk-ic { color: var(--accent-text); }
.pick-list { max-height: 46vh; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.pick { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 6px; border-radius: 12px; }
.pick:active { background: var(--surface-2); }
.pick .grow { flex: 1; min-width: 0; font-weight: 650; line-height: 1.3; }
.pick small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; }
.pick > .ic { color: var(--accent-text); }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } }

/* Rezeptansicht */
.wrap.detail { padding-top: 0; }
.hero { position: relative; display: grid; place-items: center; overflow: hidden; background: var(--ph); margin: 0 -16px; aspect-ratio: 16 / 11; max-height: 360px; }
.hero .emo { font-size: 80px; }
.hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: linear-gradient(180deg, rgba(14,11,22,0), var(--bg)); pointer-events: none; }
.hero.noimg { aspect-ratio: auto; height: 150px; }
@media (min-width: 792px) { .hero { margin: 14px 0 0; border-radius: var(--r); } }
.d-head { position: relative; z-index: 1; margin-top: -40px; }
.d-title { font-size: 28px; line-height: 1.12; font-weight: 800; letter-spacing: -.025em; margin: 0 0 10px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.meta > span, .meta a { display: inline-flex; align-items: center; gap: 5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); }
.meta a { color: var(--accent-text); text-decoration: none; font-weight: 650; background: var(--accent-soft); }
.meta .ftag { color: var(--accent-text); }
.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
.act { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px 9px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; font-weight: 650; color: var(--muted); }
.act:active { background: var(--surface-2); }
.act.on { background: var(--accent-soft); border-color: rgba(184,161,255,.45); color: var(--accent-text); }
.act.star.on .ic { color: var(--gold); }
.strip { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 8px 10px 8px 12px; border-radius: 14px; background: linear-gradient(135deg, rgba(124,77,255,.2), rgba(177,77,255,.08)); border: 1px solid rgba(184,161,255,.3); font-size: 14px; }
.strip > .ic { color: var(--accent-text); }
.strip .grow { flex: 1; min-width: 0; }
.strip button.grow { text-align: left; }
.d-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
.stepper { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; height: 44px; flex: none; }
.stepper button { width: 44px; height: 100%; display: grid; place-items: center; color: var(--accent-text); }
.stepper span { min-width: 104px; text-align: center; font-weight: 650; font-size: 15px; white-space: nowrap; }
.mini { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; height: 32px; background: var(--surface-2); flex: none; }
.mini button { width: 30px; height: 100%; display: grid; place-items: center; color: var(--accent-text); }
.mini span { min-width: 22px; text-align: center; font-weight: 750; font-size: 14px; font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin: 20px 0 14px; position: sticky; top: calc(60px + env(safe-area-inset-top)); z-index: 4; }
.seg button { height: 40px; border-radius: 10px; font-weight: 650; font-size: 15px; color: var(--muted); }
.seg button.on { background: var(--grad); color: #fff; box-shadow: 0 4px 14px rgba(124,77,255,.35); }
.seg small { font-weight: 500; opacity: .8; margin-left: 4px; }
.ings { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ings li + li { border-top: 1px solid var(--line); }
.ing { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 14px; }
.ing-amt { flex: none; min-width: 76px; max-width: 42%; font-weight: 750; color: var(--accent-text); font-variant-numeric: tabular-nums; }
.ing-t { flex: 1; min-width: 0; }
.box { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #5B5176; display: grid; place-items: center; }
.ing .box { margin-left: auto; }
.ing.on .box, .step.on .num, .si.done .box, .chk.on .box { background: var(--grad); border-color: transparent; color: #fff; }
.ing.on .ing-t, .ing.on .ing-amt { text-decoration: line-through; color: var(--faint); }
.ing-h { padding: 14px 14px 6px; font-weight: 750; font-size: 12px; color: var(--accent-text); text-transform: uppercase; letter-spacing: .08em; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.step { display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; cursor: pointer; transition: opacity .15s; }
.step-head { display: flex; align-items: center; justify-content: space-between; }
.step-lbl { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 750; color: var(--accent-text); }
.num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.step-t { font-size: 16px; line-height: 1.6; }
.step.on { opacity: .5; }
.tmr { display: inline-flex; align-items: center; gap: 4px; padding: 0 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-weight: 750; font-size: .92em; border: 1px solid rgba(184,161,255,.4); vertical-align: baseline; line-height: 1.7; }
.tmr .ic { display: inline-block; }
.tmr:active { background: var(--surface-3); }
.notes { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin: 0; white-space: pre-line; }
.detail section { margin-top: 26px; }
.d-foot { font-size: 13px; color: var(--faint); margin: 12px 2px 0; text-align: center; }

/* Formularelemente */
.field { display: block; margin-bottom: 14px; }
.lbl { display: block; font-size: 13px; font-weight: 650; color: var(--muted); margin-bottom: 6px; }
.lbl small { font-weight: 400; color: var(--faint); }
input:not([type=search]):not([type=file]), textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; outline: none; -webkit-appearance: none; }
textarea { resize: none; line-height: 1.5; min-height: 80px; display: block; }
textarea.big { min-height: 220px; }
input:focus, textarea:focus { border-color: var(--accent-text); box-shadow: 0 0 0 3px rgba(124,77,255,.28); }
::placeholder { color: var(--faint); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; white-space: nowrap; border-radius: 12px; font-weight: 650; }
.btn.accent { background: var(--grad); color: #fff; }
.btn.ghost { background: var(--surface); border: 1px solid var(--line); }
.btn.danger { background: transparent; border: 1px solid rgba(255,138,128,.4); color: var(--danger); }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14.5px; }
.btn.wide { width: 100%; }
.btn:active { opacity: .85; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.btn-row .btn { flex: 1 1 150px; }
.note-box { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.45; margin: 0 0 16px; }
.note-box .ic { color: var(--accent-text); margin-top: 1px; }
.lead { color: var(--muted); margin: 0 0 14px; font-size: 15px; }
.muted { color: var(--muted); font-size: 14.5px; margin: 0 0 12px; }

/* Editor */
.photo { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 260px; border-radius: var(--r); border: 1.5px dashed rgba(184,161,255,.45); background: linear-gradient(135deg, rgba(124,77,255,.14), rgba(177,77,255,.06)); color: var(--accent-text); font-weight: 650; overflow: hidden; margin-bottom: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.photo.has { border-style: solid; border-color: var(--line); }
.photo-acts { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 8px; }
.photo-acts button { height: 34px; padding: 0 12px; border-radius: 999px; background: rgba(14,11,22,.78); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; font-size: 13px; font-weight: 650; display: inline-flex; align-items: center; gap: 6px; }
input.t-input { font-size: 22px; font-weight: 750; letter-spacing: -.02em; padding: 12px 14px; margin-bottom: 12px; }
.ed-sec { margin-top: 22px; }
.ed-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.er { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 3px; position: relative; }
.er.dragging { z-index: 5; box-shadow: 0 14px 34px rgba(0,0,0,.55); border-color: var(--accent-text); background: var(--surface-2); }
.ed-list input, .ed-list textarea { border: 0; background: transparent; box-shadow: none; padding: 9px 8px; border-radius: 10px; }
.ed-list input:focus, .ed-list textarea:focus { background: var(--surface-2); box-shadow: none; }
.er .amt { width: 31%; max-width: 130px; flex: none; font-weight: 700; color: var(--accent-text); }
.er .nm { flex: 1; min-width: 0; }
.er.grp { background: var(--accent-soft); border-color: rgba(184,161,255,.3); }
.er.grp .nm { font-weight: 750; color: var(--accent-text); }
.er.st { align-items: flex-start; }

.grip { width: 30px; height: 40px; display: grid; place-items: center; color: var(--faint); touch-action: none; cursor: grab; flex: none; -webkit-user-select: none; user-select: none; }

.ed-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 650; color: var(--accent-text); }
.pill:active { background: var(--surface-2); }
.emojis { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 6px 0 16px; }
.emojis button { aspect-ratio: 1; border-radius: 12px; font-size: 21px; background: var(--surface-2); border: 1px solid var(--line); }
.emojis button.on { border-color: var(--accent-text); background: var(--accent-soft); }

/* Planer */
.week { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 0 14px; }
.week-l { text-align: center; flex: 1; }

.sumcard { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; border-radius: var(--r); margin-bottom: 14px; background: linear-gradient(135deg, #2B1B52 0%, #1B1430 100%); border: 1px solid rgba(184,161,255,.25); }
.sumcard .grow { flex: 1; min-width: 0; }
.sumcard b { display: block; font-size: 17px; }
.sumcard small { color: var(--muted); font-size: 13px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; }
.day.today { border-color: rgba(184,161,255,.6); box-shadow: 0 0 0 1px rgba(184,161,255,.2) inset; }
.day.past { opacity: .6; }
.day-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 8px 14px; }
.day-n { font-weight: 750; }
.day-n small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.now { color: var(--accent-text); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-left: 8px; }
.day-add { height: 34px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); color: var(--accent-text); font-size: 13px; font-weight: 700; }
.pe { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-top: 1px solid var(--line); }
.pe-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; }
.pe-ph { position: relative; width: 46px; height: 46px; border-radius: 12px; flex: none; overflow: hidden; display: grid; place-items: center; background: var(--ph); font-size: 22px; }
.pe-ph .emo { font-size: 22px; }
.pe-t { flex: 1; min-width: 0; font-weight: 650; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.pe-t small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; }
.pe .x { width: 32px; height: 32px; display: grid; place-items: center; color: var(--faint); flex: none; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 14px; }
.dchip { display: flex; flex-direction: column; align-items: center; padding: 7px 0; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-size: 11.5px; color: var(--muted); font-weight: 650; }
.dchip b { font-size: 16px; color: var(--ink); }
.dchip.today { border-color: rgba(184,161,255,.6); }
.dchip.on { background: var(--grad); border-color: transparent; color: #fff; }
.dchip.on b { color: #fff; }
.sheet-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 2px 14px; }

/* Einkauf */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 14px; }
.panel p { margin: 0 0 10px; font-size: 15px; }
.panel .sec { margin-bottom: 8px; }
.panel a { color: var(--accent-text); font-weight: 650; }
.panel.flush { padding: 0; overflow: hidden; }
.panel.flush .sec-row { padding: 14px 14px 0; }
.panel-btns { display: flex; gap: 8px; padding: 10px 12px 12px; flex-wrap: wrap; border-top: 1px solid var(--line); }
.panel-empty { padding: 4px 14px 12px; color: var(--muted); font-size: 14.5px; }
.price-box { color: var(--ink); border-radius: var(--r); padding: 16px 16px 14px; margin-bottom: 12px; overflow: hidden; background: linear-gradient(135deg, #2B1B52 0%, #1B1430 100%); border: 1px solid rgba(184,161,255,.25); }
.pb-label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; font-weight: 700; }
.pb-total { font-size: 32px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; }
.pb-sub { font-size: 13px; opacity: .85; margin-top: 2px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 14px -16px 0; padding: 0 16px 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }

.chip { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); text-align: left; }
.chip span { font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip b { font-size: 16px; }
.chip small { font-size: 11px; opacity: .75; }
.chip.on { background: var(--grad); color: #fff; border-color: transparent; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; box-shadow: 0 0 0 1.5px rgba(255,255,255,.75); }
.pb-note { font-size: 12px; opacity: .7; margin-top: 12px; }
.prog-row { display: flex; align-items: center; gap: 12px; margin: 6px 2px 14px; }
.pbar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--grad); border-radius: 3px; }
.prog-row small { color: var(--muted); font-size: 13px; white-space: nowrap; }
.shop-sec { margin-bottom: 18px; }
.si-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.si { display: flex; align-items: center; }
.si + .si { border-top: 1px solid var(--line); }
.si-btn { flex: 1; display: flex; align-items: flex-start; gap: 12px; text-align: left; padding: 12px 14px; min-width: 0; }
.si-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.si-top { display: flex; gap: 4px 8px; align-items: baseline; flex-wrap: wrap; }
.si-name { font-weight: 650; }
.si-amt { color: var(--muted); font-size: 14px; }
.si-offer, .si-for { font-size: 13px; color: var(--faint); overflow-wrap: anywhere; line-height: 1.4; }
.si-for { color: var(--accent-text); opacity: .85; }
.si-price { font-weight: 700; font-size: 15px; white-space: nowrap; padding-top: 1px; }
.si .box { margin-top: 1px; }
.si.done .si-name, .si.done .si-amt { text-decoration: line-through; color: var(--faint); }
.si.done .si-price { color: var(--faint); }
.si-x { width: 42px; align-self: stretch; display: grid; place-items: center; color: var(--faint); flex: none; }
.si.pant { padding: 8px 10px 8px 14px; gap: 10px; }
.extra-row { display: flex; gap: 8px; }
.extra-row input { flex: 1; min-width: 0; }
.extra-row .btn { flex: none; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { display: inline-flex; align-items: center; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 4px 3px 12px; font-size: 14px; }
.tag button { width: 26px; height: 26px; display: grid; place-items: center; color: var(--faint); }
.store-tg { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
.store-tg button { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; font-weight: 650; }
.store-tg button.off { opacity: .45; text-decoration: line-through; }
.store-tg .dot { box-shadow: none; }
.store-tg small { font-weight: 400; color: var(--muted); font-size: 12px; }

/* Mehr / Hilfe */
details { border-top: 1px solid var(--line); padding: 12px 0 4px; }
summary { font-weight: 650; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--accent-text); font-size: 22px; font-weight: 400; line-height: 1; }

.guide { margin: 12px 0 8px; padding-left: 22px; font-size: 15px; }
.guide > li { margin-bottom: 12px; padding-left: 2px; }
.kw { display: inline-block; margin-left: 4px; font-size: 12px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }

.tm { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-radius: 16px; background: rgba(35,28,51,.97); border: 1px solid rgba(184,161,255,.4); box-shadow: 0 10px 30px rgba(0,0,0,.45); }

.dres { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 10px; }
.dres-t { font-weight: 750; font-size: 16.5px; line-height: 1.3; }

.pill.acc { background: var(--grad); color: #fff; border-color: transparent; }
.opt .tag-ai { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 750; color: #fff; background: var(--grad); border-radius: 999px; padding: 1px 7px; vertical-align: 1px; }

  // ---------- Navigation mit Verlauf (Zurück-Geste / -Taste) ----------
  var depth = 0;
  function scrollKey() { return S.view + (S.view === 'detail' ? ':' + S.id : ''); }
  function nav(view, extra, push) {
    S.scroll[scrollKey()] = window.scrollY;
    if (extra) for (var k in extra) S[k] = extra[k];
    S.view = view; S.sheet = null;
    if (ROOTS[view]) S.root = view;
    try {
      if (push) { depth++; history.pushState({ v: view, id: S.id, d: depth }, ''); }
      else history.replaceState({ v: view, id: S.id, d: depth }, '');
    } catch (e) {}
    render();
    window.scrollTo(0, push ? 0 : (S.scroll[scrollKey()] || 0));
  }
  function back() {
    if (depth > 0) { history.back(); return; }
    nav(S.root, { form: null });
  }
  window.addEventListener('popstate', function (e) {
    var st = e.state;

    depth = st.d || 0;
    var v = st.v;
    if ((v === 'detail' || v === 'cook') && !byId(st.id)) v = S.root;
    if (v === 'form' && !S.form) v = S.root;
    if (v !== 'form') S.form = null;
    S.view = v; S.id = st.id; S.sheet = null;

  var SORTS = { 'new': 'Neueste zuerst', az: 'A–Z', fast: 'Schnellste zuerst', cooked: 'Zuletzt gekocht', most: 'Am öftesten gekocht' };

    var mins = function (r) { var n = parseInt(r.minutes, 10); return n > 0 ? n : 1e6; };
    var by = {
      'new': function (a, b) { return b.createdAt - a.createdAt; },
      az: function (a, b) { return a.title.localeCompare(b.title, 'de'); },
      fast: function (a, b) { return mins(a) - mins(b) || a.title.localeCompare(b.title, 'de'); },
      cooked: function (a, b) { return b.lastCooked - a.lastCooked || b.createdAt - a.createdAt; },
      most: function (a, b) { return b.cooked - a.cooked || b.lastCooked - a.lastCooked; }

  function unwrapShared(text) {
    var t = String(text || '').trim();
    var start = t.indexOf('{'), end = t.lastIndexOf('}');
    if (start === -1 || end <= start || !/"(title|provider_name|embed_product_id)"\s*:/.test(t)) return { text: t };
    var j = null;
    try { j = JSON.parse(t.slice(start, end + 1)); } catch (e) {
      var m = t.match(/"title"\s*:\s*"((?:[^"\\]|\\.)*)"/);
      if (m) { try { j = { title: JSON.parse('"' + m[1] + '"') }; } catch (e2) { j = { title: m[1] }; } }
      var a = t.match(/"author_unique_id"\s*:\s*"([^"]+)"/), v = t.match(/"embed_product_id"\s*:\s*"?(\d+)/);
      if (j && a && v) { j.author_unique_id = a[1]; j.embed_product_id = v[1]; }
    }
    if (!j || typeof j !== 'object') return { text: t };
    var title = String(j.title || '').trim();
    var src = j.author_unique_id && j.embed_product_id ? 'https://www.tiktok.com/@' + j.author_unique_id + '/video/' + j.embed_product_id : '';

    return { text: title + (src ? '\n' + src : '') };
  }

        el.classList.toggle('on', map[k]);
        el.setAttribute('aria-pressed', String(map[k]));
        if (a === 'tick') el.querySelector('.box').innerHTML = map[k] ? ic('check', 14) : '';
        else el.querySelector('.num').innerHTML = map[k] ? ic('check', 14) : String(+k.split(':s').pop() + 1);
        break;
      }
      case 'timer': startTimer(+el.getAttribute('data-s'), el.getAttribute('data-l') + (r ? ' · ' + r.title : '')); break;
      case 't-add': timers.forEach(function (t) { if (t.id === el.getAttribute('data-t')) t.end += 60000; }); updateDock(); break;
      case 't-x': timers = timers.filter(function (t) { return t.id !== el.getAttribute('data-t'); }); renderDock(); break;
      case 'cooked': {
        var prev = [r.cooked, r.lastCooked];
        r.cooked++; r.lastCooked = Date.now(); save(); rerender();
        toast('Guten Appetit! ' + plural(r.cooked, 'Mal', 'Mal') + ' gekocht', 'Rückgängig', function () { r.cooked = prev[0]; r.lastCooked = prev[1]; save(); rerender(); });
        break;
      }
      case 'rmore': S.sheet = { type: 'rmore' }; render(); break;
      case 'edit': if (r) nav('form', { form: makeForm('edit', r) }, true); break;
      case 'delete': if (r) deleteRecipe(r); break;
      case 'share-recipe': S.sheet = null; render(); shareRecipe(r); break;
      case 'dup': {
        var copy = normalize(JSON.parse(JSON.stringify(r)));
        copy.id = uid(); copy.title = r.title + ' (Kopie)'; copy.createdAt = copy.updatedAt = Date.now(); copy.cooked = 0; copy.lastCooked = 0; copy.fav = false;
        S.recipes.push(copy); save();
        nav('detail', { id: copy.id }, false);
        toast('Kopie angelegt – mit ✎ anpassen');
        break;
      }
      case 'cook-start': nav('cook', { cook: 0 }, true); break;
      case 'cook-next': S.cook++; render(); window.scrollTo(0, 0); break;
      case 'cook-prev': S.cook = Math.max(0, S.cook - 1); render(); window.scrollTo(0, 0); break;
      case 'cook-ings': S.sheet = { type: 'ings' }; render(); break;
      case 'cook-finish': {
        r.cooked++; r.lastCooked = Date.now(); save();
        back(); toast('Guten Appetit! 🎉');
        break;
      }

      // Planer
      case 'plan-open': {
        var sel = {};
        plannedDays(r.id).forEach(function (k) { sel[k] = true; });
        S.sheet = { type: 'planr', rid: r.id, sel: sel, orig: JSON.parse(JSON.stringify(sel)), p: curPortions(r) };
        render();
        break;
      }
      case 'pr-day': { var dk = el.getAttribute('data-d'); S.sheet.sel[dk] = !S.sheet.sel[dk]; render(); break; }
      case 'pr-por': S.sheet.p = Math.max(1, S.sheet.p + +el.getAttribute('data-n')); render(); break;
      case 'pr-save': {
        var sh = S.sheet, added = 0, removed = 0;
        Object.keys(sh.sel).forEach(function (k) {
          if (sh.sel[k] && !sh.orig[k]) { addPlan(k, { rid: sh.rid, p: sh.p }); added++; }
          if (!sh.sel[k] && sh.orig[k]) { S.plan[k] = (S.plan[k] || []).filter(function (x) { return x.rid !== sh.rid; }); removed++; }
        });
        savePlan(); S.sheet = null; rerender();
        toast(added ? 'Eingeplant für ' + plural(added, 'Tag', 'Tage') : removed ? 'Planung geändert' : 'Nichts geändert', added ? 'Planer öffnen' : '', function () { nav('plan', { week: 0 }, true); });
        break;
      }
      case 'plan-goto': {
        var gd = parseYmd(el.getAttribute('data-d'));
        nav('plan', { week: Math.round((monday(gd) - monday(new Date())) / (7 * 86400000)) }, true);
        break;
      }
      case 'week': S.week += +el.getAttribute('data-n'); render(); break;
      case 'week-now': S.week = 0; render(); break;
      case 'week-shop': {
        var mon = addDays(monday(new Date()), S.week * 7), from = ymd(mon), to = ymd(addDays(mon, 6));
        if (from < today()) from = today();
        planToShop(from, to);
        break;
      }
      case 'plan-shop': planToShop(today(), ymd(addDays(new Date(), 6))); break;
      case 'day-add': S.sheet = { type: 'day', d: el.getAttribute('data-d'), q: '', note: '' }; render(); break;
      case 'day-pick': {
        var pr = byId(el.getAttribute('data-id')), dd = S.sheet.d;
        addPlan(dd, { rid: pr.id, p: baseServ(pr) || 1 });
        S.sheet = null; rerender(); toast(dayName(dd) + ': ' + pr.title);
        break;
      }
      case 'day-note': {
        var nt = trim(S.sheet.note);
        if (!nt) { toast('Schreib zuerst eine Notiz.'); break; }
        addPlan(S.sheet.d, { text: nt }); S.sheet = null; rerender();
        break;
      }
      case 'pe-step': {
        var fe = findEntry(el.getAttribute('data-d'), el.getAttribute('data-e'));
        if (fe) { fe.e.p = Math.max(1, (fe.e.p || 1) + +el.getAttribute('data-n')); savePlan(); rerender(); }
        break;
      }
      case 'pe-del': {
        var dk2 = el.getAttribute('data-d'), fe2 = findEntry(dk2, el.getAttribute('data-e'));
        if (!fe2) break;
        fe2.list.splice(fe2.i, 1); savePlan(); rerender();
        toast('Aus dem Plan entfernt', 'Rückgängig', function () { (S.plan[dk2] = S.plan[dk2] || []).splice(fe2.i, 0, fe2.e); savePlan(); rerender(); });
        break;
      }

      // Einkauf
      case 'pick': S.sheet = { type: 'pick', q: '' }; render(); break;
      case 'pick-recipe': {
        var pk = byId(el.getAttribute('data-id'));
        if (pk) { S.shop.plan[pk.id] = baseServ(pk) || 1; saveShop(); }
        S.sheet = null; rerender();
        break;
      }
      case 'shop-tick': {
        var sk = el.getAttribute('data-k');
        if (S.shop.checked[sk]) delete S.shop.checked[sk]; else S.shop.checked[sk] = true;
        saveShop(); rerender();
        break;
      }
      case 'shop-buy': S.shop.buy[el.getAttribute('data-k')] = true; saveShop(); rerender(); break;
      case 'shop-unbuy': delete S.shop.buy[el.getAttribute('data-k')]; saveShop(); rerender(); break;
      case 'shop-mode': S.shop.mode = el.getAttribute('data-m'); saveShop(); rerender(); break;
      case 'hide-done': S.prefs.hideDone = !S.prefs.hideDone; savePrefs(); rerender(); break;
      case 'extra-add': addExtra(); break;
      case 'extra-remove': S.shop.extras.splice(+el.getAttribute('data-i'), 1); saveShop(); rerender(); break;
      case 'shop-clear': {
        var backup = JSON.stringify(S.shop);
        S.shop.plan = {}; S.shop.extras = []; S.shop.checked = {}; S.shop.buy = {}; saveShop(); rerender();
        toast('Einkaufsliste geleert', 'Rückgängig', function () { S.shop = JSON.parse(backup); saveShop(); rerender(); });
        break;
      }
      case 'shop-share': shareShop(); break;
      case 'store-toggle': { var st = el.getAttribute('data-s'); S.shop.off[st] = storeOn(st); saveShop(); rerender(); break; }

      // Editor
      case 'cancel-form':
        if (formDirty() && !window.confirm('Änderungen verwerfen?')) break;
        clearDraft(); S.form = null; back();
        break;
      case 'save': saveForm(); break;
      case 'photo-pick': document.getElementById('photoFile').click(); break;
      case 'photo-del': f.image = ''; rerender(); saveDraftSoon(); break;
      case 'ing-add': f.ings.push({ t: 'i', a: '', n: '' }); rerender(); focusLater('[data-ing="' + (f.ings.length - 1) + '"][data-k="a"]'); break;
      case 'grp-add': f.ings.push({ t: 'h', a: '', n: '' }); rerender(); focusLater('[data-ing="' + (f.ings.length - 1) + '"][data-k="n"]'); break;
      case 'ing-del': f.ings.splice(+el.getAttribute('data-i'), 1); if (!f.ings.length) f.ings.push({ t: 'i', a: '', n: '' }); rerender(); saveDraftSoon(); break;
      case 'step-add': f.steps.push(''); rerender(); focusLater('[data-step="' + (f.steps.length - 1) + '"]'); break;
      case 'step-del': f.steps.splice(+el.getAttribute('data-i'), 1); if (!f.steps.length) f.steps.push(''); rerender(); saveDraftSoon(); break;
      case 'bulk': S.sheet = { type: 'bulk', k: el.getAttribute('data-k'), text: '' }; render(); focusLater('[data-bind="bulk"]'); break;
      case 'bulk-paste':
        readClipboard().then(function (t) { S.sheet.text = (S.sheet.text ? S.sheet.text + '\n' : '') + (t || ''); render(); }).catch(function () { toast('Tippe lange ins Textfeld und wähle „Einfügen“.'); });
        break;
      case 'bulk-ok': {
        var txt = S.sheet.text || '', key = S.sheet.k;
        if (key === 'ings') {
          var rows = rowsFromLines(lines(P.convertUnits(txt)).map(function (l) { return l.replace(/^[•\-*–·▪◦]\s*/, ''); }));
          f.ings = f.ings.filter(function (x) { return trim(x.a) || trim(x.n); }).concat(rows);
          if (!f.ings.length) f.ings.push({ t: 'i', a: '', n: '' });
        } else {
          var st2 = lines(P.convertUnits(txt)).map(function (l) { return l.replace(/^(?:schritt|step)?\s*\d{1,2}\s*[.):]\s*/i, '').replace(/^[•\-*–]\s*/, ''); });
          if (st2.length === 1 && st2[0].length > 160) st2 = st2[0].replace(/([.!?])\s+(?=[A-ZÄÖÜ])/g, '$1\n').split('\n');
          f.steps = f.steps.filter(function (x) { return trim(x); }).concat(st2.filter(Boolean));
          if (!f.steps.length) f.steps.push('');
        }
        S.sheet = null; rerender(); saveDraftSoon();
        break;
      }
      case 'convert': {
        var changed = false;
        f.ings.forEach(function (x) {
          if (x.t !== 'i') return;
          var before = trim(x.a + ' ' + x.n), after = P.convertUnits(before);
          if (after !== before) { var sp = splitAmount(after); x.a = sp.amt; x.n = sp.name; changed = true; }
        });
        f.steps = f.steps.map(function (s) { var c = P.convertUnits(s); if (c !== s) changed = true; return c; });
        var nn = P.convertUnits(f.notes); if (nn !== f.notes) { f.notes = nn; changed = true; }
        if (changed) { rerender(); toast('Einheiten umgerechnet'); } else toast('Keine US-Einheiten gefunden');
        break;
      }

      // Import
      case 'paste-into':
        readClipboard().then(function (t) {
          t = t || '';
          var had = S.importText.trim();
          if (had && t.trim() && had.indexOf(t.trim()) === -1) { S.importText = had + '\n' + t; toast('Teil angehängt'); }
          else S.importText = t || S.importText;
          S.importHint = '';
          render();
        }).catch(function () { toast('Tippe lange ins Textfeld und wähle „Einfügen“.'); });
        break;
      case 'parse':
      case 'parse-rules':
        if (!S.importText.trim()) { toast('Füge zuerst einen Text ein.'); break; }
        startReview(S.importText, a === 'parse' ? { ai: true } : { rules: true });
        break;
      case 'raw': {
        var p = P.parse(S.importText);
        nav('form', { form: makeForm('review', { title: p.title, minutes: p.minutes, servings: p.servings, source: p.source, notes: S.importText.trim() }) }, false);
        break;
      }

      // Mehr
      case 'discover': nav('discover', {}, true); break;
      case 'discover-q': S.disc = { q: S.query, results: null }; nav('discover', {}, true); runDiscover(S.query); break;
      case 'disc-chip': S.disc = { q: el.getAttribute('data-q'), results: S.disc && S.disc.results }; runDiscover(S.disc.q); rerender(); break;
      case 'disc-go': runDiscover(S.disc && S.disc.q); break;
      case 'disc-import': { var dr2 = S.disc && S.disc.results && S.disc.results[+el.getAttribute('data-i')]; if (dr2) runImportUrl(dr2.url, +el.getAttribute('data-i')); break; }
      case 'ai-photos':
        if (!aiOn()) { S.sheet = { type: 'ai-need' }; render(); break; }
        S.sheet = null; render(); document.getElementById('aiFiles').click();
        break;
      case 'ai-setup': nav('more', {}, false); setTimeout(function () { var k = document.getElementById('ki'); if (k) k.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, 60); break;
      case 'ai-redo': S.sheet = null; render(); if (r) aiRedo(r); break;
      case 'busy-cancel': if (aiAbort) aiAbort.abort(); busy(null); break;
      case 'ai-prov': S.aiProv = el.getAttribute('data-p'); rerender(); break;
      case 'ai-save': {
        var key = trim(S.aiKey), prov = S.aiProv || 'claude';
        if (!key) { toast('Füge zuerst den API-Schlüssel ein.'); focusLater('[data-bind="aikey"]'); break; }
        if (prov === 'claude' && !/^sk-ant-/.test(key)) toast('Hinweis: Claude-Schlüssel beginnen meist mit „sk-ant-“.');
        var cfg = { provider: prov, key: key, model: trim(S.aiModel), translate: true, auto: true };
        aiSet(cfg); S.aiKey = ''; S.aiModel = ''; rerender();
        aiTest(cfg);
        break;
      }
      case 'ai-test': aiTest(); break;
      case 'ai-off':
        if (!window.confirm('KI-Schlüssel von diesem Gerät entfernen?')) break;
        lsDel(AI_KEY); rerender(); toast('Schlüssel entfernt – die App erkennt Rezepte wieder ohne KI');
        break;
      case 'ai-auto':
      case 'ai-translate': {
        var cf = aiCfg(), k2 = a === 'ai-auto' ? 'auto' : 'translate';
        cf[k2] = !cf[k2]; aiSet(cf); rerender();
        break;
      }
      case 'toggle-direct': lsSet(DIRECT_KEY, directSave() ? '0' : '1'); rerender(); toast(directSave() ? 'Rezepte werden direkt gespeichert' : 'Rezepte werden vorher zum Prüfen angezeigt'); break;
      case 'export': exportBackup(); break;
      case 'import-backup': document.getElementById('backupFile').click(); break;
      case 'copy': {
        var text = el.getAttribute('data-text');
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('Kopiert'); }, function () { toast('Kopieren nicht möglich'); });
        break;
      }
    }
  });

  // ---------- Eingaben ----------
  document.addEventListener('input', function (e) {
    var t = e.target, b = t.getAttribute('data-bind');
    if (S.form && S.view === 'form') {
      var fk = t.getAttribute('data-f'), ii = t.getAttribute('data-ing'), si = t.getAttribute('data-step');
      if (fk) S.form[fk] = t.value;
      if (ii != null && S.form.ings[+ii]) S.form.ings[+ii][t.getAttribute('data-k')] = t.value;
      if (si != null) S.form.steps[+si] = t.value;
      if (fk || ii != null || si != null) saveDraftSoon();
    }
    if (b === 'query') {
      S.query = t.value;
      document.getElementById('grid').innerHTML = gridHtml();
    }
    if (b === 'importText') S.importText = t.value;
    if (b === 'extraText') S.extraText = t.value;
    if (b === 'aikey') S.aiKey = t.value;
    if (b === 'discq') { S.disc = S.disc || { q: '', results: null }; S.disc.q = t.value; }
    if (b === 'aimodel') S.aiModel = t.value;
    if (S.sheet) {
      if (b === 'fname') S.sheet.name = t.value;
      if (b === 'note') S.sheet.note = t.value;
      if (b === 'bulk') S.sheet.text = t.value;
      if (b === 'sheetq') {
        S.sheet.q = t.value;
        var sl = document.getElementById('sheetList');
        if (sl) sl.innerHTML = S.sheet.type === 'pick' ? pickList('pick-recipe', S.shop.plan) : pickList('day-pick');
      }
    }
    if (t.tagName === 'TEXTAREA') autosize(t);
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); return; }
    if (e.key !== 'Enter' || !t.getAttribute) return;
    var b = t.getAttribute('data-bind');
    if (b === 'extraText') { e.preventDefault(); addExtra(); }
    else if (b === 'fname') { e.preventDefault(); var sv = app.querySelector('[data-a="folder-save"]'); if (sv) sv.click(); }
    else if (b === 'note') { e.preventDefault(); var dn = app.querySelector('[data-a="day-note"]'); if (dn) dn.click(); }
    else if (b === 'discq') { e.preventDefault(); t.blur(); runDiscover(t.value); }
    else if (t.hasAttribute('data-ing') && S.form) {
      // Enter springt zur nächsten Zutat bzw. legt eine neue an
      e.preventDefault();
      var i = +t.getAttribute('data-ing'), k = t.getAttribute('data-k');
      if (k === 'a' && S.form.ings[i].t === 'i') { focusLater('[data-ing="' + i + '"][data-k="n"]'); return; }
      S.form.ings.splice(i + 1, 0, { t: 'i', a: '', n: '' });
      rerender(); focusLater('[data-ing="' + (i + 1) + '"][data-k="a"]');
    }
  });
  // Wischen im Kochmodus
  var touchX = null, touchY = null;
  document.addEventListener('touchstart', function (e) { if (S.view === 'cook' && !S.sheet) { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; } }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (touchX == null || S.view !== 'cook') return;
    var dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
    touchX = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    var r = byId(S.id);
    if (dx < 0 && S.cook < r.steps.length - 1) S.cook++;
    else if (dx > 0 && S.cook > 0) S.cook--;
    else return;
    render(); window.scrollTo(0, 0);
  }, { passive: true });

  // ---------- Start ----------
  load();
  try { history.replaceState({ v: S.view, id: null, d: 0 }, ''); } catch (e) {}
  if (!checkIncoming()) render();
  loadPrices();
  setTimeout(cleanupImages, 4000);
  window.addEventListener('hashchange', checkIncoming);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
