<html lang="de">
<head>
<meta charset="utf-8">

<title>Karim’s Rezepte</title>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root {
  --bg: #0E0B16; --surface: #1A1526; --surface-2: #231C33; --ink: #F3EFFC; --muted: #B4AACB; --faint: #7F7598; --line: #2E2642;
  --brand: #120E1D; --on-brand: #F3EFFC; --accent: #7C4DFF; --accent-2: #B14DFF; --accent-text: #B8A1FF; --accent-ink: #FFFFFF; --accent-soft: #2A2045; --danger: #FF8A80;
  --grad: linear-gradient(135deg, #7C4DFF 0%, #B14DFF 100%);
  --serif: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 18px; --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; display: block; }

.bar { position: sticky; top: 0; z-index: 10; background: var(--brand); color: var(--on-brand); padding-top: env(safe-area-inset-top); }
.bar-in { max-width: 760px; margin: 0 auto; height: 56px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 6px; }
.bar-l { justify-self: start; display: flex; align-items: center; min-width: 0; }
.bar-r { justify-self: end; display: flex; align-items: center; gap: 2px; }
.bar-title { font-weight: 600; font-size: 16px; white-space: nowrap; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--serif); font-size: 21px; padding-left: 10px; white-space: nowrap; }
.tbtn { display: inline-flex; align-items: center; gap: 2px; height: 40px; padding: 0 10px; border-radius: 10px; color: var(--on-brand); font-size: 16px; }
.tbtn.icon { width: 42px; justify-content: center; padding: 0; }
.tbtn:active { background: rgba(255,255,255,.12); }
.tbtn.strong { background: var(--accent); color: var(--accent-ink); font-weight: 650; height: 34px; padding: 0 14px; border-radius: 999px; margin-right: 4px; }

.wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px calc(112px + env(safe-area-inset-bottom)); }

.hint { display: flex; gap: 10px; align-items: flex-start; background: var(--brand); color: var(--on-brand); border-radius: var(--r); padding: 12px 12px 12px 14px; margin-bottom: 14px; font-size: 14px; line-height: 1.45; }
.hint .x { margin-left: auto; color: var(--on-brand); opacity: .8; width: 28px; height: 28px; display: grid; place-items: center; flex: none; }

.paste-cta { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: var(--surface); border: 1.5px dashed var(--accent); border-radius: var(--r); padding: 14px 16px; margin-bottom: 14px; }
.paste-cta > .ic { color: var(--accent-text); }
.paste-cta strong { display: block; font-weight: 600; }
.paste-cta small { display: block; color: var(--muted); font-size: 13px; }
.paste-cta:active { background: var(--accent-soft); }

.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; margin-bottom: 14px; color: var(--faint); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; height: 44px; font: inherit; color: var(--ink); outline: none; -webkit-appearance: none; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; gap: 6px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-height: 104px; transition: transform .1s; }
.card:active { transform: scale(.985); }
.card-t { font-family: var(--serif); font-size: 19px; line-height: 1.25; }
.card-i { font-size: 13px; color: var(--faint); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.meta > span, .meta a { display: inline-flex; align-items: center; gap: 5px; }
.meta a { color: var(--accent-text); text-decoration: none; font-weight: 600; }

.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
.empty .ic { margin: 0 auto 10px; color: var(--faint); }
.empty-t { font-family: var(--serif); font-size: 21px; color: var(--ink); margin: 0 0 4px; }
.empty p { margin: 0 auto; max-width: 300px; }

.fab { position: fixed; right: max(16px, calc(50% - 364px)); bottom: calc(20px + env(safe-area-inset-bottom)); display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 650; border-radius: 999px; height: 52px; padding: 0 22px 0 16px; box-shadow: 0 6px 20px rgba(0,0,0,.18); z-index: 5; }
.fab:active { transform: scale(.97); }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 20; animation: fade .15s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 20px 20px 0 0; padding: 10px 16px calc(22px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; animation: up .22s ease-out; }
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet-t { font-family: var(--serif); font-size: 22px; font-weight: normal; margin: 0 4px 12px; }
.opt { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 14px 12px; border-radius: 14px; border: 1px solid var(--line); margin-bottom: 10px; background: var(--surface-2); }
.opt-ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: var(--on-brand); flex: none; }
.opt-ic.accent { background: var(--accent); color: var(--accent-ink); }
.opt strong { display: block; font-weight: 600; }
.opt small { display: block; color: var(--muted); font-size: 13px; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } }

.d-title { font-family: var(--serif); font-weight: normal; font-size: 31px; line-height: 1.15; margin: 6px 0 10px; overflow-wrap: anywhere; }
.detail section { margin-top: 26px; }
.sec { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 650; margin: 0 0 10px; }
.ings { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ings li + li { border-top: 1px solid var(--line); }
.ing { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; }
.box { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--faint); display: grid; place-items: center; margin-top: 1px; }
.ing.on .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ing.on .ing-t { text-decoration: line-through; color: var(--faint); }
.ing-h { padding: 14px 14px 6px; font-weight: 650; font-size: 14px; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.step { display: flex; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; transition: opacity .15s; }
.num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: var(--on-brand); font-weight: 650; font-size: 14px; display: grid; place-items: center; }
.step-t { padding-top: 2px; line-height: 1.55; }
.step.on { opacity: .5; }
.step.on .num { background: var(--accent); color: var(--accent-ink); }
.notes { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin: 0; }
.d-foot { font-size: 13px; color: var(--faint); margin-top: 28px; }

.field { display: block; margin-bottom: 16px; }
.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.lbl small { font-weight: 400; color: var(--faint); }
input:not([type=search]), textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; outline: none; -webkit-appearance: none; }
textarea { resize: none; line-height: 1.5; min-height: 92px; display: block; }
textarea.big { min-height: 220px; }
input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
::placeholder { color: var(--faint); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 14px; white-space: nowrap; border-radius: 12px; font-weight: 600; }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface); border: 1px solid var(--line); }
.btn:active { opacity: .85; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.btn-row .btn { flex: 1 1 150px; }
.note-box { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.45; margin: 0 0 16px; }
.note-box .ic { color: var(--accent-text); margin-top: 1px; }
.lead { color: var(--muted); margin: 0 0 14px; font-size: 15px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 14px; }
.panel p { margin: 0 0 10px; font-size: 15px; }
.panel .sec { margin-bottom: 8px; }
details { border-top: 1px solid var(--line); padding: 12px 0 4px; }
summary { font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--accent-text); font-size: 22px; font-weight: 400; line-height: 1; }
details[open] summary::after { content: "–"; }
.guide { margin: 12px 0 8px; padding-left: 22px; font-size: 15px; }
.guide > li { margin-bottom: 12px; padding-left: 2px; }
.guide ul { padding-left: 18px; margin: 6px 0 0; }
.guide ul li { margin-bottom: 6px; }
.en { color: var(--faint); font-size: 13px; }
.kw { display: inline-block; margin-left: 4px; font-size: 12px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; overflow-wrap: anywhere; }
.copy { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--accent-text); font-weight: 600; margin-left: 4px; vertical-align: middle; }
.ver { text-align: center; color: var(--faint); font-size: 12px; margin-top: 20px; }

.tbtn.cart { position: relative; }
.badge { position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; line-height: 1; }
.d-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
.stepper { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; height: 44px; flex: none; }
.stepper button { width: 44px; height: 100%; display: grid; place-items: center; color: var(--accent-text); }
.stepper span { min-width: 108px; text-align: center; font-weight: 600; font-size: 15px; white-space: nowrap; }
.stepper.sm { height: 38px; }
.stepper.sm button { width: 38px; }
.stepper.sm span { min-width: 96px; font-size: 14px; }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 15px; }
.si .btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; flex: none; }
.plan-list { list-style: none; margin: 0 0 12px; padding: 0; }
.plan-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.plan-t { text-align: left; font-family: var(--serif); font-size: 17px; line-height: 1.25; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.muted { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
.price-box { background: var(--brand); color: var(--on-brand); border-radius: var(--r); padding: 16px 16px 14px; margin-bottom: 10px; overflow: hidden; }
.pb-label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; font-weight: 650; }
.pb-total { font-family: var(--serif); font-size: 32px; line-height: 1.15; }
.pb-sub { font-size: 13px; opacity: .85; margin-top: 2px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 14px -16px 0; padding: 0 16px 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.08); color: var(--on-brand); border: 1px solid rgba(255,255,255,.18); text-align: left; }
.chip span { font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip b { font-size: 16px; }
.chip small { font-size: 11px; opacity: .75; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; box-shadow: 0 0 0 1.5px rgba(255,255,255,.75); }
.pb-note { font-size: 12px; opacity: .7; margin-top: 12px; }
.progress { font-size: 13px; color: var(--muted); margin: 0 2px 12px; }
.shop-sec { margin-bottom: 18px; }
.sec-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 0 2px 8px; }
.sec-row .sec { margin: 0; display: flex; align-items: center; gap: 7px; }
.sec-sum { font-weight: 650; font-size: 15px; }
.si-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.si { display: flex; align-items: center; }
.si + .si { border-top: 1px solid var(--line); }
.si-btn { flex: 1; display: flex; align-items: flex-start; gap: 12px; text-align: left; padding: 12px 14px; min-width: 0; }
.si-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.si-top { display: flex; gap: 4px 8px; align-items: baseline; flex-wrap: wrap; }
.si-name { font-weight: 600; }
.si-amt { color: var(--muted); font-size: 14px; }
.si-offer { font-size: 13px; color: var(--faint); overflow-wrap: anywhere; line-height: 1.4; }
.si-price { font-weight: 650; font-size: 15px; white-space: nowrap; padding-top: 1px; }
.si.done .si-name, .si.done .si-amt { text-decoration: line-through; color: var(--faint); }
.si.done .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.si.done .si-price { color: var(--faint); }
.si-x { width: 42px; align-self: stretch; display: grid; place-items: center; color: var(--faint); flex: none; }
.si.pant { padding: 8px 10px 8px 14px; gap: 10px; }
.extra-row { display: flex; gap: 8px; }
.extra-row input { flex: 1; min-width: 0; }
.extra-row .btn { flex: none; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { display: inline-flex; align-items: center; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 4px 3px 12px; font-size: 14px; }
.tag button { width: 26px; height: 26px; display: grid; place-items: center; color: var(--faint); }
.store-tg { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
.store-tg button { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; font-weight: 600; }
.store-tg button.off { opacity: .45; text-decoration: line-through; }
.store-tg .dot { box-shadow: none; }
.store-tg small { font-weight: 400; color: var(--muted); font-size: 12px; }
.pick-list { max-height: 60vh; overflow-y: auto; }
.pick-list .opt { justify-content: space-between; }
.pick-list .opt > .ic { color: var(--accent-text); }
.panel a { color: var(--accent-text); font-weight: 600; }
/* ---------- Dunkel/Lila-Design ---------- */
body { background: radial-gradient(1200px 500px at 50% -200px, #2A1B4A 0%, var(--bg) 60%) no-repeat, var(--bg); }
.bar { background: rgba(18,14,29,.82); -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px); border-bottom: 1px solid var(--line); }
.brand, .card-t, .empty-t, .sheet-t, .d-title, .plan-t, .pb-total { font-weight: 750; letter-spacing: -0.02em; }
.brand { font-size: 20px; }
.brand .ic { color: var(--accent-text); }
.tbtn:active { background: rgba(255,255,255,.08); }
.tbtn.strong, .btn.accent, .fab, .chip.on, .opt-ic.accent { background: var(--grad); color: #fff; }
.fab { box-shadow: 0 10px 30px rgba(124,77,255,.45); }
.paste-cta { background: linear-gradient(135deg, rgba(124,77,255,.18), rgba(177,77,255,.10)); border: 1px solid rgba(184,161,255,.35); }
.paste-cta strong { color: var(--ink); }
.search, input:not([type=search]), textarea, .opt, .ings, .si-list, .step, .notes, .panel, .stepper, .btn.ghost, .tag, .store-tg button { background: var(--surface); border-color: var(--line); }
.card { background: linear-gradient(180deg, #1F1930 0%, var(--surface) 100%); border: 1px solid var(--line); box-shadow: var(--shadow); min-height: 118px; }
.card:active { border-color: rgba(184,161,255,.5); }
.card-t { font-size: 18px; }
.meta > span { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); }
.card .meta > span { padding: 2px 8px; font-size: 12px; }
.meta a { background: var(--accent-soft); border-radius: 999px; padding: 3px 10px; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-bottom: 0; }
.opt-ic { background: var(--surface-2); color: var(--accent-text); }
.hint { background: var(--accent-soft); color: var(--ink); border: 1px solid rgba(184,161,255,.25); }
.hint .x { color: var(--muted); }
.note-box { background: var(--accent-soft); color: var(--ink); }
.price-box { background: linear-gradient(135deg, #2B1B52 0%, #1B1430 100%); border: 1px solid rgba(184,161,255,.25); }
.chip { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.12); }
.badge { background: var(--grad); color: #fff; }
.num { background: var(--accent-soft); color: var(--accent-text); }
.step.on .num, .ing.on .box, .si.done .box { background: var(--grad); border-color: transparent; color: #fff; }
.box { border-color: #5B5176; }
.kw { background: var(--surface-2); border-color: var(--line); }
code { background: var(--surface-2); border-color: var(--line); }
#toast { background: #F3EFFC; color: #120E1D; }
input:focus, textarea:focus { border-color: var(--accent-text); box-shadow: 0 0 0 3px rgba(124,77,255,.28); }

/* Rezeptansicht */
.d-hero { padding: 6px 0 4px; }
.d-kicker { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-text); font-weight: 700; margin: 4px 0 2px; }
.d-title { font-size: 30px; line-height: 1.12; margin: 2px 0 12px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin: 20px 0 14px; position: sticky; top: calc(64px + env(safe-area-inset-top)); z-index: 4; }
.seg button { height: 40px; border-radius: 10px; font-weight: 650; font-size: 15px; color: var(--muted); }
.seg button.on { background: var(--grad); color: #fff; box-shadow: 0 4px 14px rgba(124,77,255,.35); }
.seg small { font-weight: 500; opacity: .8; margin-left: 4px; }
.ing { align-items: center; padding: 13px 14px; gap: 12px; }
.ing-amt { flex: none; min-width: 78px; max-width: 42%; font-weight: 750; color: var(--accent-text); font-variant-numeric: tabular-nums; }
.ing-t { flex: 1; min-width: 0; }
.ing .box { margin-top: 0; margin-left: auto; }
.ing.on .ing-amt { color: var(--faint); text-decoration: line-through; }
.ing-h { color: var(--accent-text); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }
.steps { gap: 12px; }

  // ---------- Bildschirm anlassen beim Kochen ----------
  var wake = null;
  function syncWake() {
    if (!('wakeLock' in navigator)) return;
    var want = S.view === 'detail' && document.visibilityState === 'visible';
    if (want && !wake) {
      navigator.wakeLock.request('screen').then(function (l) {
        wake = l;
        l.addEventListener('release', function () { wake = null; });
      }).catch(function () {});
    } else if (!want && wake) {
      wake.release().catch(function () {});
      wake = null;
    }
  }
  document.addEventListener('visibilitychange', syncWake);

  // ---------- Import ----------
  function formFromParsed(p) {
    return { mode: 'review', id: null, createdAt: null, title: p.title, minutes: p.minutes, servings: p.servings, source: p.source, notes: p.notes, ingredients: p.ingredients.join('\n'), steps: p.steps.join('\n') };
  }

  // Antwort der TikTok-Schnittstelle (JSON) direkt verstehen: Beschreibung steht in "title"
  function unwrapShared(text) {
    var t = String(text || '').trim();
    var start = t.indexOf('{'), end = t.lastIndexOf('}');
    if (start === -1 || end <= start || !/"(title|provider_name|embed_product_id)"\s*:/.test(t)) return { text: t };
    var j = null;
    try { j = JSON.parse(t.slice(start, end + 1)); } catch (e) {
      // Kurzbefehle zeigen Wörterbücher manchmal ohne gültiges JSON an – dann "title" direkt herausholen
      var m = t.match(/"title"\s*:\s*"((?:[^"\\]|\\.)*)"/);
      if (m) { try { j = { title: JSON.parse('"' + m[1] + '"') }; } catch (e2) { j = { title: m[1] }; } }
      var a = t.match(/"author_unique_id"\s*:\s*"([^"]+)"/), v = t.match(/"embed_product_id"\s*:\s*"?(\d+)/);
      if (j && a && v) { j.author_unique_id = a[1]; j.embed_product_id = v[1]; }
    }
    if (!j || typeof j !== 'object') return { text: t };
    var title = String(j.title || '').trim();
    var src = j.author_unique_id && j.embed_product_id ? 'https://www.tiktok.com/@' + j.author_unique_id + '/video/' + j.embed_product_id : '';
    if (!title) return { text: '', empty: true, src: src };
    return { text: title + (src ? '\n' + src : '') };
  }

  function startReview(text) {
    var u = unwrapShared(text);
    if (u.empty) {
      go('import', { importText: u.src || '', importHint: 'TikTok hat für dieses Video keine Beschreibung mitgeschickt. Steht das Rezept im Video oder in den Kommentaren, nutze den Kurzbefehl <b>„Rezept vom Bildschirm“</b> (zweimal auf die Rückseite tippen) oder füge den Text hier ein.' });
      return;
    }
    text = u.text;
    var p = P.parse(text);
    if (p.title && p.ingredients.length && p.steps.length && directSave()) {
      var dup = S.recipes.filter(function (r) { return r.title.toLowerCase() === p.title.toLowerCase() && r.ingredients.length === p.ingredients.length; })[0];
      if (dup) { go('detail', { id: dup.id, tab: 'ing', importText: '', importHint: '' }); toast('Dieses Rezept ist schon gespeichert'); return; }
      S.form = formFromParsed(p); S.form.mode = 'auto';
      saveForm();
      return;
    }
    if (p.ingredients.length || p.steps.length) { go('form', { form: formFromParsed(p), importHint: '' }); return; }
    var hint;
    if (/instagram\.com/i.test(text)) {
      hint = 'Von Instagram ist nur der Link angekommen – Instagram gibt die Beschreibung beim Teilen nicht weiter. Klapp die Beschreibung im Video auf und tippe zweimal auf die Rückseite des iPhones (Kurzbefehl <b>„Rezept vom Bildschirm“</b>, Anleitung unter Hilfe &amp; Backup).';
    } else if (/tiktok\.com/i.test(text)) {
      hint = 'Von TikTok ist nur der Link angekommen. Prüfe den Kurzbefehl „Rezept speichern“ (Hilfe &amp; Backup) oder nutze „Rezept vom Bildschirm“ – oder füge die Beschreibung hier ein.';
    } else {
      hint = 'In diesem Text wurden keine Zutaten oder Schritte gefunden. Ergänze ihn oder leg das Rezept trotzdem an.';
    }
    go('import', { importText: text, importHint: hint, importParsed: p });
  }

  function readClipboard() {
    if (!navigator.clipboard || !navigator.clipboard.readText) return Promise.reject(new Error('unsupported'));
    return navigator.clipboard.readText();
  }

  function pasteFlow() {
    readClipboard().then(function (t) {
      if (!t || !t.trim()) { go('import', { importText: '', importHint: 'Die Zwischenablage ist leer. Teile zuerst ein Video an den Kurzbefehl oder füge den Text hier ein.' }); return; }
      startReview(t);
    }).catch(function () {
      go('import', { importText: '', importHint: 'Kein Zugriff auf die Zwischenablage. Tippe lange ins Textfeld und wähle <b>Einfügen</b>.' });
    });
  }

  function checkIncoming() {
    var t = null;
    try {
      if (location.hash.indexOf('#text=') === 0) t = decodeURIComponent(location.hash.slice(6).replace(/\+/g, ' '));
      else t = new URLSearchParams(location.search).get('text');
    } catch (e) { t = null; }
    if (!t) return false;
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    startReview(t);
    return true;
  }

  // ---------- Speichern / Löschen ----------
  function saveForm() {
    var f = S.form;
    var title = String(f.title || '').trim();
    if (!title) {
      toast('Bitte gib einen Titel ein.');
      var i = app.querySelector('[data-f="title"]');
      if (i) i.focus();
      return;
    }
    var now = Date.now();
    var rec = {
      id: f.id || uid(), title: title,
      minutes: String(f.minutes || '').trim(), servings: String(f.servings || '').trim(),
      source: String(f.source || '').trim(), notes: String(f.notes || '').trim(),
      ingredients: lines(f.ingredients), steps: lines(f.steps),
      createdAt: f.createdAt || now, updatedAt: now
    };
    var idx = -1;
    for (var k = 0; k < S.recipes.length; k++) if (S.recipes[k].id === rec.id) idx = k;
    if (idx >= 0) S.recipes[idx] = rec; else S.recipes.push(rec);
    if (!save()) return;
    toast(f.mode === 'edit' ? 'Änderungen gespeichert' : f.mode === 'auto' ? 'Rezept gespeichert – mit ✎ kannst du es anpassen' : 'Rezept gespeichert');
    go('detail', { id: rec.id, form: null, importText: '', importHint: '', tab: 'ing' });
  }

  function formDirty() {
    var f = S.form;
    return f && f.mode !== 'edit' && (String(f.title).trim() || String(f.ingredients).trim() || String(f.steps).trim());
  }

  // ---------- Backup ----------
  function exportBackup() {
    var data = JSON.stringify({ app: 'kochbuch', version: 1, exportedAt: new Date().toISOString(), recipes: S.recipes }, null, 2);
    var name = 'karims-rezepte-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    var file = null;
    try { file = new File([data], name, { type: 'application/json' }); } catch (e) {}
    if (file && isTouch() && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Karim’s Rezepte – Backup' }).catch(function (err) {
        if (!err || err.name !== 'AbortError') download(data, name);
      });
      return;
    }
    download(data, name);
  }
  function download(data, name) {
    var url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast('Backup gespeichert');
  }
  document.getElementById('backupFile').addEventListener('change', function (e) {
    var input = e.target, file = input.files && input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        var list = Array.isArray(data) ? data : data && data.recipes;
        if (!Array.isArray(list)) throw new Error('format');
        var added = 0, updated = 0;
        list.forEach(function (raw) {
          if (!raw || !raw.title) return;
          var r = normalize(raw), found = -1;
          for (var i = 0; i < S.recipes.length; i++) if (S.recipes[i].id === r.id) found = i;
          if (found === -1) { S.recipes.push(r); added++; }
          else if (r.updatedAt > S.recipes[found].updatedAt) { S.recipes[found] = r; updated++; }
        });
        if (save()) { render(); toast(added + ' neu, ' + updated + ' aktualisiert'); }
      } catch (err) {
        toast('Diese Datei ist kein Rezepte-Backup.');
      }
      input.value = '';
    };
    reader.readAsText(file);
  });

  // ---------- Ereignisse ----------
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]');
    if (!el) return;
    var a = el.getAttribute('data-a');
    var r = S.id ? byId(S.id) : null;
    switch (a) {
      case 'back': go(S.view === 'detail' && S.backTo ? S.backTo : 'list', { importText: '', importHint: '', backTo: null }); break;
      case 'shop': go('shop'); break;
      case 'toggle-direct': lsSet(DIRECT_KEY, directSave() ? '0' : '1'); rerender(); toast(directSave() ? 'Rezepte werden direkt gespeichert' : 'Rezepte werden vorher zum Prüfen angezeigt'); break;
      case 'tab': S.tab = el.getAttribute('data-t'); rerender(); break;
      case 'por-minus':
      case 'por-plus':
        if (r) {
          var cur = curPortions(r);
          cur = a === 'por-plus' ? cur + 1 : Math.max(1, cur - 1);
          S.portions[r.id] = cur;
          if (S.shop.plan[r.id]) { S.shop.plan[r.id] = cur; saveShop(); }
          rerender();
        }
        break;
      case 'to-list':
        if (r) { S.shop.plan[r.id] = curPortions(r); saveShop(); rerender(); toast('Auf der Einkaufsliste: ' + portionLabel(r, S.shop.plan[r.id])); }
        break;
      case 'plan-minus':
      case 'plan-plus': {
        var pid = el.getAttribute('data-id'), pv = S.shop.plan[pid] || 1;
        pv = a === 'plan-plus' ? pv + 1 : pv - 1;
        if (pv < 1) delete S.shop.plan[pid]; else S.shop.plan[pid] = pv;
        delete S.portions[pid];
        saveShop(); rerender();
        break;
      }
      case 'pick': S.sheet = 'pick'; render(); break;
      case 'pick-recipe': {
        var pr = byId(el.getAttribute('data-id'));
        if (pr) { S.shop.plan[pr.id] = baseServ(pr) || 1; saveShop(); }
        S.sheet = null; rerender();
        break;
      }
      case 'shop-tick': {
        var sk = el.getAttribute('data-k');
        if (S.shop.checked[sk]) delete S.shop.checked[sk]; else S.shop.checked[sk] = true;
        saveShop(); rerender();
        break;
      }
      case 'shop-buy': S.shop.buy[el.getAttribute('data-k')] = true; saveShop(); rerender(); break;
      case 'shop-unbuy': delete S.shop.buy[el.getAttribute('data-k')]; saveShop(); rerender(); break;
      case 'shop-mode': S.shop.mode = el.getAttribute('data-m'); saveShop(); rerender(); break;
      case 'extra-add': addExtra(); break;
      case 'extra-remove': S.shop.extras.splice(+el.getAttribute('data-i'), 1); saveShop(); rerender(); break;
      case 'shop-clear':
        if (window.confirm('Einkaufsliste leeren?')) { S.shop.plan = {}; S.shop.extras = []; S.shop.checked = {}; S.shop.buy = {}; saveShop(); rerender(); }
        break;
      case 'shop-share': shareShop(); break;
      case 'store-toggle': {
        var st = el.getAttribute('data-s');
        S.shop.off[st] = storeOn(st);
        saveShop(); rerender();
        break;
      }
      case 'settings': go('settings'); break;
      case 'add': S.sheet = 'add'; render(); break;
      case 'close-sheet': S.sheet = null; render(); break;
      case 'import': go('import', { importText: '', importHint: '' }); break;
      case 'new': go('form', { form: { mode: 'new', id: null, createdAt: null, title: '', minutes: '', servings: '', source: '', notes: '', ingredients: '', steps: '' } }); break;
      case 'open': go('detail', { id: el.getAttribute('data-id'), backTo: S.view === 'shop' ? 'shop' : null, tab: 'ing' }); break;
      case 'tick':
      case 'step': {
        var map = a === 'tick' ? S.checked : S.done, k = el.getAttribute('data-k');
        map[k] = !map[k];
        el.classList.toggle('on', map[k]);
        el.setAttribute('aria-pressed', String(map[k]));
        if (a === 'tick') el.querySelector('.box').innerHTML = map[k] ? ic('check', 14) : '';
        break;
      }
      case 'edit':
        if (r) go('form', { form: { mode: 'edit', id: r.id, createdAt: r.createdAt, title: r.title, minutes: r.minutes, servings: r.servings, source: r.source, notes: r.notes, ingredients: r.ingredients.join('\n'), steps: r.steps.join('\n') } });
        break;
      case 'delete':
        if (r && window.confirm('„' + r.title + '“ wirklich löschen?')) {
          S.recipes = S.recipes.filter(function (x) { return x.id !== r.id; });
          save();
          go('list');
          toast('Rezept gelöscht');
        }
        break;
      case 'cancel-form':
        if (formDirty() && !window.confirm('Rezept verwerfen?')) break;
        if (S.form && S.form.mode === 'edit') go('detail', { form: null }); else go('list', { form: null });
        break;
      case 'save': saveForm(); break;
      case 'convert': {
        var changed = false;
        ['ingredients', 'steps', 'notes'].forEach(function (key) {
          var before = S.form[key], after = P.convertUnits(before);
          if (after !== before) { S.form[key] = after; changed = true; }
        });
        if (changed) { render(); toast('Einheiten umgerechnet'); } else toast('Keine US-Einheiten gefunden');
        break;
      }
      case 'paste': pasteFlow(); break;
      case 'paste-into':
        readClipboard().then(function (t) {
          t = t || '';
          var had = S.importText.trim();
          if (had && t.trim() && had.indexOf(t.trim()) === -1) { S.importText = had + '\n' + t; toast('Teil angehängt'); }
          else S.importText = t || S.importText;
          S.importHint = '';
          render();
        }).catch(function () { toast('Tippe lange ins Textfeld und wähle „Einfügen“.'); });
        break;
      case 'parse':
        if (!S.importText.trim()) { toast('Füge zuerst einen Text ein.'); break; }
        startReview(S.importText);
        break;
      case 'raw': {
        var p = P.parse(S.importText);
        go('form', { form: { mode: 'review', id: null, createdAt: null, title: p.title, minutes: p.minutes, servings: p.servings, source: p.source, notes: S.importText.trim(), ingredients: '', steps: '' } });
        break;
      }
      case 'export': exportBackup(); break;
      case 'import-backup': document.getElementById('backupFile').click(); break;
      case 'dismiss-hint': lsSet(HINT_KEY, '1'); render(); break;
      case 'copy': {
        var text = el.getAttribute('data-text');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { toast('Kopiert'); }, function () { toast('Kopieren nicht möglich'); });
        }
        break;
      }
    }
  });

  app.addEventListener('input', function (e) {
    var t = e.target;
    var f = t.getAttribute('data-f'), b = t.getAttribute('data-bind');
    if (f && S.form) S.form[f] = t.value;
    if (b === 'query') { S.query = t.value; document.getElementById('grid').innerHTML = gridHtml(); }
    if (b === 'importText') S.importText = t.value;
    if (b === 'extraText') S.extraText = t.value;
    if (t.tagName === 'TEXTAREA') autosize(t);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); }
    if (e.key === 'Enter' && e.target.getAttribute && e.target.getAttribute('data-bind') === 'extraText') { e.preventDefault(); addExtra(); }
  });

  // ---------- Start ----------
  load();
  loadShop();
  if (!checkIncoming()) render();
  loadPrices();
  window.addEventListener('hashchange', checkIncoming);
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
